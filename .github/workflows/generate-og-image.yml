name: Generate OG image

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/generate-og-image.yml"
      - "package.json"
      - "scripts/generate-og-image.mjs"
      - "public/campaign/tombra-portrait-high-res.jpg"
      - "public/campaign/tombra-portrait.jpg"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate social preview image
        run: |
          npm install
          npm run generate:og

      - name: Commit generated image
        run: |
          if git diff --quiet -- public/og-image.png; then
            echo "No OG image changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/og-image.png
          git commit -m "Generate high-quality OG image"
          git push
