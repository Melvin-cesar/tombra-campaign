name: Generate OG image

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/generate-og-image.yml"
      - "scripts/generate_og_image.py"
      - "public/campaign/tombra-portrait.jpg"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image tools
        run: python -m pip install --upgrade pillow

      - name: Generate social preview image
        run: python scripts/generate_og_image.py

      - name: Commit generated image
        run: |
          if git diff --quiet -- public/og-image.png; then
            echo "No OG image changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/og-image.png
          git commit -m "Generate high-quality OG image"
          git push
