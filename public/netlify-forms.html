<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Netlify Form Definitions</title>
  </head>
  <body hidden>
    <form
      action="/"
      data-netlify="true"
      method="POST"
      name="volunteer-form"
      netlify-honeypot="bot-field"
    >
      <input type="hidden" name="form-name" value="volunteer-form" />
      <input name="bot-field" />
      <input name="fullName" />
      <input name="phone" />
      <input name="email" />
      <input name="lga" />
      <input name="ward" />
      <input name="community" />
      <input name="volunteerRole" />
      <input name="available" />
      <input name="consent" />
    </form>

    <form
      action="/"
      data-netlify="true"
      method="POST"
      name="community-concern-form"
      netlify-honeypot="bot-field"
    >
      <input type="hidden" name="form-name" value="community-concern-form" />
      <input name="bot-field" />
      <input name="fullName" />
      <input name="phone" />
      <input name="lga" />
      <input name="ward" />
      <input name="community" />
      <input name="issueCategory" />
      <input name="description" />
      <input name="consent" />
    </form>

    <form
      action="/"
      data-netlify="true"
      method="POST"
      name="contact-form"
      netlify-honeypot="bot-field"
    >
      <input type="hidden" name="form-name" value="contact-form" />
      <input name="bot-field" />
      <input name="fullName" />
      <input name="phone" />
      <input name="email" />
      <input name="community" />
      <input name="message" />
      <input name="consent" />
    </form>
  </body>
</html>
